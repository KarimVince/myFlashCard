services:
  # ── Backend — FastAPI ─────────────────────────────────────────────────
  - type: web
    name: myflashcard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myflashcard-db
          property: connectionString
      - key: R2_ACCOUNT_ID
        sync: false          # set manually in Render dashboard
      - key: R2_ACCESS_KEY_ID
        sync: false          # set manually in Render dashboard
      - key: R2_SECRET_ACCESS_KEY
        sync: false          # set manually in Render dashboard
      - key: R2_BUCKET
        value: myflashcard
      - key: R2_PUBLIC_URL
        sync: false          # set to https://pub-xxx.r2.dev after R2 bucket created
      - key: ADMIN_PASSWORD_HASH
        sync: false          # set manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false          # set to frontend URL after first deploy
      - key: PORT
        value: "8000"
    healthCheckPath: /health

  # ── Frontend — Next.js standalone ────────────────────────────────────
  - type: web
    name: myflashcard-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false          # set to https://myflashcard-api.onrender.com
      - key: NEXT_PUBLIC_APK_URL
        sync: false          # set to https://pub-xxx.r2.dev/downloads/myflashcard.apk
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"

databases:
  - name: myflashcard-db
    databaseName: myflashcard
    plan: free
