name: Deploy

# MANUAL TRIGGER — select target, track and status in the GitHub Actions UI → "Run workflow".
# Backend and frontend also deploy automatically on push to main via auto-deploy.yml;
# use this workflow for Android releases and for manual redeploys.
#
# Targets:
#   android  — build signed AAB → upload to Play Store
#   backend  — trigger Render deploy hook
#   frontend — trigger Render deploy hook
#   all      — all of the above
#
# Play tracks (Android only):
#   alpha      → Closed testing
#   internal   → Internal testing
#   production → Production (the service account needs production permission first)
#
# Play status (Android only):
#   completed → roll the release out on the track
#   draft     → upload it and finish the rollout by hand in Play Console
#
# Before each Android release: bump appVersion in android/app/build.gradle.kts
# and update the release notes in android/whatsnew/whatsnew-en-US.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        type: choice
        options:
          - android
          - backend
          - frontend
          - all
        default: android
      track:
        description: 'Play track (alpha = Closed testing)'
        required: true
        type: choice
        options:
          - alpha
          - internal
          - production
        default: alpha
      status:
        description: 'Play release status'
        required: true
        type: choice
        options:
          - completed
          - draft
        default: completed

jobs:
  # ── Step 0: Run full test suite before anything deploys ───────────────────
  test:
    name: Run all tests (pre-deploy gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Android unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-deploy
          path: android/app/build/reports/tests/

  # ── Step 1: Build signed AAB and upload to Play Store ────────────────────
  deploy-android:
    name: Build AAB → Play Store (${{ inputs.track }}, ${{ inputs.status }})
    needs: test
    if: inputs.target == 'android' || inputs.target == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/willygo-release.keystore

      - name: Write local.properties (CI credentials only — no sdk.dir needed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" \
            > android/local.properties

      - name: Build signed release AAB
        working-directory: android
        # The offset keeps version codes above those of the releases uploaded by hand (1–4).
        run: VERSION_CODE=$(( ${{ github.run_number }} + 100 )) ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.willygo.myflashcard
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: android/whatsnew

  # ── Step 2: Backend deploy → Render ──────────────────────────────────────
  deploy-backend:
    name: Backend → Render
    needs: test
    if: inputs.target == 'backend' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"

      - name: Wait for deploy to finish
        run: |
          echo "Deploy triggered — check https://dashboard.render.com for status."

  # ── Step 3: Frontend deploy → Render ─────────────────────────────────────
  deploy-frontend:
    name: Frontend → Render
    needs: test
    if: inputs.target == 'frontend' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"

      - name: Wait for deploy to finish
        run: |
          echo "Deploy triggered — check https://dashboard.render.com for status."
