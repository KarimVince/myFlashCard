<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5A5"/>
      <stop offset="55%" stop-color="#14B88A"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAFBF3"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F766E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)"/>

  <!-- subtle inner glow -->
  <circle cx="256" cy="200" r="170" fill="#FFFFFF" opacity="0.08"/>

  <!-- Back card (slightly offset, tilted) -->
  <g transform="rotate(-8 256 200)" filter="url(#softShadow)">
    <rect x="160" y="90" width="160" height="215" rx="18" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Front card -->
  <g transform="rotate(6 256 200)" filter="url(#softShadow)">
    <rect x="178" y="82" width="160" height="215" rx="18" fill="url(#cardGrad)"/>
    <!-- lightning bolt on the card -->
    <path d="M278 112 L220 205 L252 205 L238 262 L300 172 L266 172 Z"
          fill="url(#boltGrad)"/>
  </g>

  <!-- App name integrated below the card, inside the artboard -->
  <text x="256" y="430" text-anchor="middle" font-family="Baloo 2" font-weight="700" font-size="58" fill="#FFFFFF">myFlashCard</text>
</svg>
